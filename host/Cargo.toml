[workspace]
resolver = "2"
members = [
    "crates/xpdash-core",
    "crates/xpdash-server",
    "crates/xpdash-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["xpdash contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
ringbuf = "0.4"
cpal = "0.15"
egui = "0.31"
eframe = "0.31"
