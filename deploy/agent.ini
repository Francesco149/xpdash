# xpdash Agent Configuration (Windows XP)
[security]
# Comma-separated list of trusted server fingerprints (SHA256:<hex64>)
# When a discovered beacon matches one of these fingerprints, the agent
# connects automatically with zero user intervention.
trusted_fingerprints=SHA256:9b37df561b5a7e48df39b4756ac8ea1b0d64b609d1d095df9e0406b0dd14504f

# If an unknown server is discovered, prompt the interactive console user (1 = yes, 0 = no)
prompt_user=1

# Disable security fingerprint checking entirely (1 = trust all LAN beacons, 0 = enforce whitelist)
allow_all=0
