# xpdash Agent Configuration (Windows XP)
[security]
# Comma-separated list of trusted server fingerprints (SHA256:<hex64>)
# When a discovered beacon matches one of these fingerprints, the agent
# connects automatically with zero user intervention.
trusted_fingerprints=SHA256:9b37df561b5a7e48df39b4756ac8ea1b0d64b609d1d095df9e0406b0dd14504f

# If an unknown server is discovered, prompt the interactive console user (1 = yes, 0 = no)
prompt_user=1

# Disable security fingerprint checking entirely (1 = trust all LAN beacons, 0 = enforce whitelist)
allow_all=0

[audio]
# Audio capture device override (optional).
# By default (-1 / empty), xpdash enumerates all recording devices and automatically
# prioritizes hardware Creative / Sound Blaster cards (Audigy, Live!, EMU10K) for
# hardware EAX / "What U Hear" capture, falling back to WAVE_MAPPER (Windows default).
#
# Set explicit device index (0, 1, ...) or substring match ("Audigy", "Realtek"):
# device_index=0
# device_name=Audigy
#
# Specific mixer recording line override (optional, e.g. "What U Hear", "Stereo Mix", "Wave Out Mix"):
# mixer_line=What U Hear

[video]
# Capture transparent & layered windows (Rainmeter desktop widgets, alpha-blended overlays, drop shadows).
#   capture_layered=1  (Default: BitBlt with CAPTUREBLT — captures all WS_EX_LAYERED windows)
capture_layered=1

# Target video capture framerate (FPS).
# Default is 60 FPS. On lower-end retro rigs (Pentium 4, Core 2 Duo), set to 30 to cut CPU usage in half.
target_fps=60

# Framerate for GDI desktop capture (FPS).
# When GPU acceleration is active, runs at full 60 FPS.
# On unaccelerated/fallback VGA drivers, xpdash automatically caps at 20 FPS to protect the CPU.
desktop_fps=60
# TurboJPEG compression quality (30-100).
# Default is 85. Lower values (70-80) reduce CPU encoding time and network bandwidth.
jpeg_quality=85
